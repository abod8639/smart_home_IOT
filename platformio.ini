; PlatformIO Project Configuration File
; Smart Home ESP32 - Main Firmware
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform   = espressif32
board      = esp32doit-devkit-v1
framework  = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Required libraries
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

; Compiler flags: enable exceptions for JSON + increase stack
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; OTA upload (after first flash via USB, subsequent uploads via WiFi)
; Uncomment and set the correct IP after first flash:
; upload_protocol = espota
; upload_port     = 192.168.1.xxx
