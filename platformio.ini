; PlatformIO Project Configuration File
; Smart Home ESP32 - Main Firmware
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform   = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = esp32doit-devkit-v1
framework  = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Required libraries
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arminjo/IRremote @ ^4.4.1

board_build.partitions = huge_app.csv

; Compiler flags: enable exceptions for JSON + increase stack
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DIR_SEND_PIN=33
    -DIR_RECEIVE_PIN=32
    -DDECODE_NEC=
    -DDECODE_SAMSUNG=
    -DDECODE_LG=
    -DDECODE_PANASONIC=
    -DDECODE_SONY=
    -DDECODE_DISTANCE_WIDTH=
    -DDECODE_HASH=

; OTA upload (after first flash via USB, subsequent uploads via WiFi)
; Uncomment and set the correct IP after first flash:
; upload_protocol = espota
; upload_port     = 192.168.1.xxx
