; PlatformIO Project Configuration File
; Smart Home ESP32 - Main Firmware
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform   = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = esp32doit-devkit-v1
framework  = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Required libraries
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arminjo/IRremote @ ^4.4.1

; board_build.partitions = huge_app.csv
board_build.partitions = max_ota.csv

; Compiler flags: enable exceptions for JSON + increase stack
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DIR_SEND_PIN=33
    -DIR_RECEIVE_PIN=32
    -DEXCLUDE_EXOTIC_PROTOCOLS=1
    -DARDUINOJSON_USE_DOUBLE=0
    -DARDUINOJSON_USE_LONG_LONG=0

; OTA upload (after first flash via USB, subsequent uploads via WiFi)
upload_protocol = espota
; upload_port     = SmartHome-ESP32.local
upload_port     = 192.168.1.2

; USB upload (Default)
; upload_protocol = esptool
; upload_port = /dev/ttyACM0
